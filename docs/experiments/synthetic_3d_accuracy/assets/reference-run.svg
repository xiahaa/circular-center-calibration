<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">一次完整运行的四场景平均圆心误差</title>
  <desc id="desc">A 到 D 四个场景中，CGA 的平均圆心误差均低于 PCL。</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #24292f; }
    .axis { stroke: #57606a; stroke-width: 1.5; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .pcl { fill: #9eb9df; }
    .cga { fill: #f4c590; }
  </style>
  <!-- Keep the chart readable when an SVG image is embedded on a dark page.
       Some Markdown renderers do not propagate prefers-color-scheme to SVGs. -->
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="25" text-anchor="middle" font-size="18">3D center error: reference run</text>
  <line class="grid" x1="70" y1="340" x2="735" y2="340"/>
  <line class="grid" x1="70" y1="270" x2="735" y2="270"/>
  <line class="grid" x1="70" y1="200" x2="735" y2="200"/>
  <line class="grid" x1="70" y1="130" x2="735" y2="130"/>
  <line class="grid" x1="70" y1="60" x2="735" y2="60"/>
  <line class="axis" x1="70" y1="60" x2="70" y2="340"/>
  <line class="axis" x1="70" y1="340" x2="735" y2="340"/>
  <text x="58" y="345" text-anchor="end" font-size="12">0.0</text>
  <text x="58" y="275" text-anchor="end" font-size="12">0.5</text>
  <text x="58" y="205" text-anchor="end" font-size="12">1.0</text>
  <text x="58" y="135" text-anchor="end" font-size="12">1.5</text>
  <text x="58" y="65" text-anchor="end" font-size="12">2.0</text>
  <text x="18" y="205" text-anchor="middle" font-size="13" transform="rotate(-90 18 205)">Mean center error (m)</text>

  <rect class="pcl" x="120" y="318.7" width="55" height="21.3"/>
  <rect class="cga" x="178" y="334.2" width="55" height="5.8"/>
  <rect class="pcl" x="280" y="61.3" width="55" height="278.7"/>
  <rect class="cga" x="338" y="262.0" width="55" height="78.0"/>
  <rect class="pcl" x="440" y="149.3" width="55" height="190.7"/>
  <rect class="cga" x="498" y="289.5" width="55" height="50.5"/>
  <rect class="pcl" x="600" y="274.7" width="55" height="65.3"/>
  <rect class="cga" x="658" y="319.0" width="55" height="21.0"/>
  <text x="176" y="365" text-anchor="middle" font-size="14">A</text>
  <text x="336" y="365" text-anchor="middle" font-size="14">B</text>
  <text x="496" y="365" text-anchor="middle" font-size="14">C</text>
  <text x="656" y="365" text-anchor="middle" font-size="14">D</text>
  <text x="405" y="392" text-anchor="middle" font-size="13">Scenario</text>

  <rect class="pcl" x="285" y="407" width="18" height="12"/>
  <text x="309" y="418" font-size="12">PCL SACMODEL</text>
  <rect class="cga" x="425" y="407" width="18" height="12"/>
  <text x="449" y="418" font-size="12">CGA</text>
</svg>
