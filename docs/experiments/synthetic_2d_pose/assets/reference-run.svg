    .ellipse { fill: #b9d9e8; stroke: #3559e0; stroke-width: 2; }
    .mass { fill: #a9e9a5; stroke: #2e9e42; stroke-width: 2; }
    .refined { fill: #ef9c9c; stroke: #ef4141; stroke-width: 2; }
    .ransac { fill: #dca9df; stroke: #9c3aa4; stroke-width: 2; }
  </style>
  <rect width="960" height="520" fill="#ffffff"/>
