<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Figure 9 reference run pose errors</title>
  <desc id="desc">Ellipse and mass centers have larger errors than refined and RANSAC centers.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #24292f; }
    .axis { stroke: #57606a; stroke-width: 1.5; }
