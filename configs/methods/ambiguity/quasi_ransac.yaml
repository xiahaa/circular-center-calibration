schema_version: 1
name: "Quasi-RANSAC"
kind: ambiguity
description: "Cross-frame two-branch disambiguation and pose estimation from the paper."
implementation:
  module: circular_center.methods.ambiguity.quasi_ransac
  class: QuasiRANSAC
parameters:
  confidence: 0.99
  valid_correspondence_ratio: 1.0
  inlier_threshold_px: 8.0
  max_iterations: 2000
  seed: 2025
  # The two projected-center candidates are unordered and often define several
  # poses with nearly equal consensus counts. A fixed 2,000-hypothesis MSAC run
  # avoids detector-dependent early stopping on one of those local solutions.
  adaptive: false
  scoring: msac
