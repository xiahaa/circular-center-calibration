name: core-ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev ninja-build
      - name: Configure C++
        run: cmake -S . -B build -G Ninja -DCCC_BUILD_TESTS=ON -DCCC_BUILD_EXAMPLES=ON
      - name: Build and test C++
        run: cmake --build build && ctest --test-dir build --output-on-failure
      - name: Run C++ example
        run: ./build/cpp/circular_center_fit_circle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python package
        run: python -m pip install -e '.[vision,dev]'
      - name: Test Python
        run: python -m pytest -q
      - name: Run public examples
        run: |
          python examples/minimal_demo.py
          python experiments/basic_experiments.py --trials 3 --output outputs/ci.json
