name: circular-center-calibration-realworld
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Exact numerical environment used for the tracked real-world golden files.
  # PCL is intentionally omitted: the Refined Center + CGA-RANSAC pipeline does
  # not load the optional PCL SACMODEL baseline.
  - python=3.10.12
  - pip>=23
  - numpy=2.2.6
  - scipy=1.15.3
  - matplotlib=3.10.9
  - opencv=4.12.0
  - pyyaml=6.0.3
  - pip:
      - -e .
