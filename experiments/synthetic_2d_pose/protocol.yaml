reproducibility:
  self_contained: true
  external_reference_required: false
  implementation: experiments/synthetic_2d_pose
  paper_figure: Figure 9
  note: The protocol is recovered from monte_carlo_2d_refinement.py, main_ransac_exp.py, and the 99 archived rows, which contain 50 unique generated trials. The unpublished intermediate p3ds/p2ds/Rs/ts NPZ files are regenerated deterministically and each unique seed is evaluated once.
