schema_version: 1
seed: 2025

circle:
  radius_m: 0.12
  noise_sigma_over_radius: 0.005
  center_min_m: -2.0
  center_max_m: 2.0
  band_jitter_degrees: 0.5

distributions:
  - {name: full_circle_uniform, label: "Full-circle uniform"}
  - {name: single_arc, label: "Single arc"}
  - {name: dual_opposite_arcs, label: "Dual opposite arcs"}
  - {name: hdl64_type_bands, label: "HDL-64-type bands"}

success_threshold_m: 0.01

method_parameters:
  CGA: {}
  PCL SACMODEL:
    # 2.5 sigma: retain noisy inliers without making the 1-cm evaluation
    # threshold part of the estimator itself.
    residual_threshold_m: 0.0015
    max_iterations: 1000
    confidence: 0.99
    minimum_radius_m: 0.06
    maximum_radius_m: 0.18

paper_outputs:
  pdf: stress_heatmap_nominal_noise.pdf
  png: stress_heatmap_nominal_noise.png

# Counts were decoded from the embedded heatmap in the published PDF. A one-count
# quantization uncertainty is possible because the trial-level data were not released.
# Matrix rows follow point_counts=[5,8,16,32,64,128], columns follow
# arc_degrees=[45,60,90,120,180,270,360].
